experiment:
  id: exp010_bootstrap_metrics_corrected
  name: Corrected volume-cluster bootstrap confidence intervals for held-out residual-risk
    metrics
inputs:
  sampled_test_pixels: local_data/evaluation/sampled_test_pixels_corrected.csv.gz
  sampled_test_pixels_sha256: fb65920ffbee3461fe2f42dd20e556323d2b15207d293ae99b0ccdbfdc9c9a77
predictors:
- reliability_full
- reliability_a4_image_only
- image_gradient
- xhat_magnitude
- psf_gain_channel
- intervention_magnitude
reference_predictor: reliability_full
comparisons:
- reliability_a4_image_only
- image_gradient
- xhat_magnitude
- psf_gain_channel
- intervention_magnitude
bootstrap:
  n_iterations: 1000
  random_seed: 20260531
  confidence_level: 0.95
  fixed_high_risk_threshold: 1.7371634244918823
  threshold_source: calibration
  resampling_unit: MRI volume
  within_volume_pixels_retained_together: true
analysis_roles:
  primary: reliability_full
  secondary: reliability_a4_image_only
  post_test_model_selection: false
outputs:
  output_dir: local_outputs/exp010_bootstrap_metrics_corrected
